# MYBOOT configuration for the test kernel, installed as \EFI\MYBOOT\BOOT.CFG.
# Format: include/config/config.h. The test kernel checks that it received
# exactly as many modules as "modules=" in its command line says.

timeout 10
default 1

entry Test kernel with self-test module
kernel KERNEL.ELF
cmdline selftest modules=1
module SELFTEST.MOD selftest

entry Test kernel without modules
kernel KERNEL.ELF
cmdline selftest modules=0
