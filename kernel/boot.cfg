# MYBOOT configuration for the test kernel, installed as \EFI\MYBOOT\BOOT.CFG.

timeout 10
default 1
background BACKGROUND.JPG

entry Test kernel with self-test module
kernel KERNEL.ELF
cmdline selftest modules=1 log_delay=40
module SELFTEST.MOD selftest

entry Test kernel without modules
kernel KERNEL.ELF
cmdline selftest modules=0 log_delay=40
